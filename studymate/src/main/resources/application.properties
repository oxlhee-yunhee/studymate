spring.application.name=studymate

# ─────────────────────────────────────────────────────────────
# 모든 환경 의존 값은 환경변수로 덮어쓸 수 있게 두고,
# 콜론 뒤 기본값은 "로컬 개발용"이다. 배포 환경에서는 반드시 환경변수를 설정한다.
# ─────────────────────────────────────────────────────────────

# 서버 (Cloud Run 등은 PORT 환경변수로 포트를 지정한다)
server.port=${PORT:8080}

# PostgreSQL (로컬 기본값은 docker-compose.yml과 일치)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studymate}
spring.datasource.username=${DB_USERNAME:studymate}
spring.datasource.password=${DB_PASSWORD:studymate}
spring.datasource.driver-class-name=org.postgresql.Driver

# 서버리스 DB(Neon 등)는 유휴 시 잠들므로 커넥션 풀을 작게 잡고 여유 있게 기다린다
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

# JPA / Hibernate
# 운영에서는 DDL_AUTO=validate 를 권장한다 (스키마가 조용히 바뀌는 것을 막는다)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# Firebase
# 파일 경로 대신 서비스 계정 JSON 문자열을 FIREBASE_CREDENTIALS_JSON 으로 넘길 수도 있다.
firebase.config-path=${FIREBASE_CONFIG_PATH:file:config/firebase/serviceAccount.json}

# 프론트엔드 출처 (CORS + WebSocket). 콤마로 여러 개 지정 가능
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 가입/로그인을 허용할 학교 이메일 도메인
app.allowed-email-domain=${APP_ALLOWED_EMAIL_DOMAIN:@sch.ac.kr}

# 관리자 이메일 (콤마 구분). 도메인 제한을 우회해 로그인하고 문의 관리 권한을 갖는다.
# 학교 계정은 졸업 후 사라질 수 있으므로 개인 이메일을 쓴다.
app.admin-emails=${APP_ADMIN_EMAILS:dbsgml0379@naver.com}

# Mail (Gmail SMTP) — 계정/앱 비밀번호는 환경변수 또는 application-local.properties 로만 넣는다
spring.config.import=optional:application-local.properties
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
