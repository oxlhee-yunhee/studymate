# 테스트 전용 설정: 실제 PostgreSQL 없이도 ./gradlew test 가 동작하도록
# H2 인메모리 DB를 PostgreSQL 호환 모드로 사용한다. (TEXT 타입 등 지원)
spring.datasource.url=jdbc:h2:mem:studymate-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Firebase 자격 증명 없이 컨텍스트만 로드
firebase.enabled=false

# Mail 자동 구성을 활성화하되 테스트에서는 실제 연결/발송하지 않는다.
spring.mail.host=localhost
spring.mail.port=2525
